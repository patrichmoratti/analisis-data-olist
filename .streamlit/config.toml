[theme]
base = "light"
primaryColor = "#1565C0"
backgroundColor = "#F4F6FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B1F2A"
borderColor = "#E3E7EF"
linkColor = "#1565C0"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap, sans-serif"
baseRadius = "0.75rem"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FB"

[server]
runOnSave = false

[browser]
gatherUsageStats = false
